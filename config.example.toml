# Copy to config.toml (or run `tabloid init --city "Your City"`) and edit.
# config.toml is git-ignored, because calendar links in it are private.
# Secrets (tablet password, API tokens) go in .env instead. See .env.example.

[dashboard]
title = "The Morning Edition"   # the masthead. Make it yours: "The Smith Times", "Daily Planet"...
name = ""                   # your first name, for "Good morning, Alex". Leave empty for just "Good morning".
orientation = "landscape"   # "landscape" or "portrait"
rotate = 90                 # landscape only: 90 or 270. If it's upside down, switch it.

[screens]
# The dashboard changes through the day. Times are "HH:MM-HH:MM" and may wrap past midnight.
# Outside these windows you get the normal (day) dashboard.
morning = "05:00-09:30"     # greeting, today's meetings, what's due, headlines, On this day
night = "21:30-05:00"       # tomorrow's plan, tomorrow's weather, an XKCD
greet = true                # day screen says "Good afternoon/evening" for one refresh at 12:00 and 17:00

[battery]
show = true                 # tablet battery in the footer
low = 10                    # at or below this (and not charging): the "I need a charge" screen

[location]                  # used for weather and air quality
name = "New York, NY"
latitude = 40.7128
longitude = -74.006
timezone = "America/New_York"   # or "auto"

[units]
temperature = "fahrenheit"  # or "celsius"
wind = "mph"                # "mph", "kmh", "ms" or "kn"
aqi = "us"                  # "us" or "european"

[air_quality]
enabled = true              # put WAQI_TOKEN in .env to use the nearest ground station

[calendar]
# Any number of iCal (.ics) links. These are private: anyone with the link can read the calendar.
#   Google:  Settings → (your calendar) → Integrate calendar → "Secret address in iCal format"
#   iCloud:  Calendar app → share calendar → Public Calendar → copy the webcal:// link
#   Outlook: Settings → Calendar → Shared calendars → Publish a calendar → ICS link
# Public holidays, e.g. India:
#   https://calendar.google.com/calendar/ical/en.indian%23holiday%40group.v.calendar.google.com/public/basic.ics
ics_urls = []
days_ahead = 3

[ticktick]
enabled = false             # true, then run `tabloid ticktick login` (see .env.example)
lists = []                  # e.g. ["Work", "Personal"]; each list gets a column. Empty = all lists.
only_due = false            # true = only tasks due within days_ahead
days_ahead = 2
max_items = 7               # per list (the layout trims more if space runs out)

# Sports: any team ESPN covers (football/soccer, NBA, NFL, MLB, NHL, college...).
# Find yours with:  tabloid sports search "arsenal"   and paste the block it prints.
# [[sports]]
# name = "Arsenal"
# sport = "soccer"
# league = "eng.1"
# team_id = 359

[xkcd]
enabled = true              # latest comic: bottom-left by day, big at night

[onthisday]
enabled = true              # Wikipedia's "On this day", on the morning screen
items = 3

[headlines]                 # RSS or Atom feeds, side by side on the morning screen
enabled = true
per_feed = 4
feeds = [
  { name = "Tech", url = "https://hnrss.org/frontpage?points=50" },
  { name = "World", url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
  # Google News for your country:  https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en
  # Google News for a topic:       https://news.google.com/rss/search?q=%22sports+analytics%22+when:7d
]

[notes]
file = "notes.md"           # one item per line; shown as a list
title = "Notes"

[quotes]
enabled = true
file = "quotes.txt"         # "quote | author" per line; one is picked per day

[schedule]
minutes = 30

[tablet]
host = "10.11.99.1"         # USB. For Wi-Fi use the tablet's IP (see `tabloid tablet info`). RM_HOST in .env wins.
user = "root"
remote_dir = "/home/root/tabloid"
sleep = true                # deep-sleep between refreshes (days of battery instead of hours)
awake_seconds = 180         # how long it stays awake after each :00/:30 for the computer to push
# key = "~/.ssh/remarkable_dashboard"
