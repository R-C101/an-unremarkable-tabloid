[project]
name = "unremarkable"
version = "0.1.0"
description = "An Unremarkable Tabloid: turn a reMarkable tablet into an e-ink wall dashboard: weather, air quality, calendar, tasks and sports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pillow>=10",
    "playwright>=1.45",
    "paramiko>=3.4",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.scripts]
tabloid = "unremarkable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unremarkable"]
