[project]
name = "rmdash"
version = "0.1.0"
description = "Turn a reMarkable tablet into a home dashboard (weather, air quality, calendar, notes)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pillow>=10",
    "playwright>=1.45",
    "paramiko>=3.4",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.scripts]
rmdash = "rmdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmdash"]
